}

* { box-sizing: border-box; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: var(--step-0);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── progress rail ────────────────────────────────────────────────────── */
#rail {
  position: fixed; inset: 0 0 auto 0; height: 3px;
  background: var(--line-soft); z-index: 40;
}
#rail-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  transition: width .35s cubic-bezier(.4,0,.2,1);
}

/* ── shell ────────────────────────────────────────────────────────────── */
.shell {
  max-width: 780px;
  margin: 0 auto;
  padding: 28px 20px 72px;
  display: flex; flex-direction: column; gap: 20px;
}

header.top { display: flex; flex-direction: column; gap: 14px; }

.brandrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand {
  font-size: var(--step-2); font-weight: 700; letter-spacing: -.02em;
  text-wrap: balance; margin: 0;
}
.brand em { font-style: normal; color: var(--accent); }
.tagline { color: var(--muted); font-size: var(--step--1); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1 1 auto; }

/* ── controls ─────────────────────────────────────────────────────────── */
button, .btn {
  font: inherit; font-family: var(--f-ui);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .08s;
}
button:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }

.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 9px; }
.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); border-color: transparent; }

input[type="text"] {
  font: inherit; font-family: var(--f-ui);
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 11px; min-width: 0;
}
input[type="text"]::placeholder { color: var(--muted); }

kbd {
  font-family: var(--f-mono); font-size: .7rem;
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px;
  background: var(--surface-2); color: var(--muted);
  white-space: nowrap;
}

/* ── identity strip ───────────────────────────────────────────────────── */
.identity {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
.identity label { font-size: var(--step--1); color: var(--muted); font-weight: 500; }
.who { font-weight: 600; }
.who .code { font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); }

/* ── stats ────────────────────────────────────────────────────────────── */
.stats { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat b {
  font-size: var(--step-2); font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1;
}
.stat span {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); font-weight: 600;
}

/* ── message card ─────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface-2);
  font-size: var(--step--1);
}
.chip {
  font-family: var(--f-mono); font-size: .7rem;
  color: var(--muted); background: var(--ground);
  border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 6px;
}
.chip.warn { color: var(--gold); border-color: var(--gold); }

.bubble-wrap { padding: 22px 18px 20px; }
.bubble {
  position: relative;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: 4px 14px 14px 14px;
  padding: 15px 17px;
  font-family: var(--f-msg);
  font-size: var(--step-1);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 46vh; overflow-y: auto;
}
.bubble::before {
  content: ""; position: absolute; top: -1px; left: -7px;
  width: 8px; height: 14px;
  background: var(--surface-2);
  border-left: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft);
  border-radius: 4px 0 0 0;
}
.received {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); font-weight: 600; margin: 0 0 8px 2px;
}

/* ── question blocks ──────────────────────────────────────────────────── */
.q { display: flex; flex-direction: column; gap: 9px; }
.q-label { font-size: var(--step--1); font-weight: 600; color: var(--ink-2); }

.verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
@media (max-width: 520px) { .verdicts { grid-template-columns: 1fr; } }

.vbtn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  padding: 15px 12px; border-radius: 10px; font-weight: 600;
  font-size: var(--step-1); border-width: 1.5px;
}
.vbtn[data-v="scam"]   { color: var(--scam);   border-color: color-mix(in srgb, var(--scam) 40%, var(--line)); }
.vbtn[data-v="legit"]  { color: var(--legit);  border-color: color-mix(in srgb, var(--legit) 40%, var(--line)); }
.vbtn[data-v="unsure"] { color: var(--unsure); border-color: color-mix(in srgb, var(--unsure) 40%, var(--line)); }
.vbtn[data-v="scam"]:hover:not(:disabled)   { background: var(--scam-soft); }
.vbtn[data-v="legit"]:hover:not(:disabled)  { background: var(--legit-soft); }
.vbtn[data-v="unsure"]:hover:not(:disabled) { background: var(--unsure-soft); }
.vbtn[aria-pressed="true"][data-v="scam"]   { background: var(--scam-soft);   border-color: var(--scam); }
.vbtn[aria-pressed="true"][data-v="legit"]  { background: var(--legit-soft);  border-color: var(--legit); }
.vbtn[aria-pressed="true"][data-v="unsure"] { background: var(--unsure-soft); border-color: var(--unsure); }

.pb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 7px; }
.pbtn {
  text-align: left; padding: 9px 11px; border-radius: 8px;
  display: flex; flex-direction: column; gap: 1px; line-height: 1.35;
}
.pbtn b { font-weight: 600; font-size: var(--step-0); }
.pbtn small { color: var(--muted); font-size: .74rem; }
.pbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.pbtn .num {
  font-family: var(--f-mono); font-size: .68rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
  margin-right: 6px;
}

.region { display: inline-block; font-family: var(--f-mono); font-size: .66rem;
  letter-spacing: .04em; color: var(--accent); }

/* ── footer actions ───────────────────────────────────────────────────── */
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--muted); font-size: var(--step--1); }

.saving { font-size: var(--step--1); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--legit); }
.dot.pending { background: var(--gold); }
.dot.err { background: var(--scam); }

/* ── notices ──────────────────────────────────────────────────────────── */
.notice {
  border: 1px solid var(--line); border-left: 3px solid var(--accent);
  background: var(--surface); border-radius: 0 10px 10px 0;
  padding: 12px 15px; font-size: var(--step--1); color: var(--ink-2);
}
.notice.warn { border-left-color: var(--gold); }
.notice b { color: var(--ink); }

/* ── panel (guideline / admin) ────────────────────────────────────────── */
details.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
}
details.panel > summary {
  cursor: pointer; padding: 11px 14px; font-weight: 600;
  font-size: var(--step--1); list-style: none;
  display: flex; align-items: center; gap: 8px;
}
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::before { content: "▸"; color: var(--muted); font-size: .8em; }
details.panel[open] > summary::before { content: "▾"; }
.panel-body {
  padding: 4px 14px 16px; border-top: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 13px;
}

.gl { display: flex; flex-direction: column; gap: 3px; }
.gl h4 { margin: 10px 0 2px; font-size: var(--step-0); }
.gl p { margin: 0; color: var(--ink-2); font-size: var(--step--1); }
.gl ul { margin: 3px 0; padding-left: 18px; color: var(--ink-2); font-size: var(--step--1); }
.gl li { margin: 2px 0; }

table.grid { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
table.grid th, table.grid td {
  text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line-soft);
}
table.grid th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.grid td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.scroll-x { overflow-x: auto; }

textarea {
  font-family: var(--f-mono); font-size: var(--step--1);
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; width: 100%; min-height: 120px; resize: vertical;
}

.done {
  text-align: center; padding: 40px 20px;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.done h2 { margin: 0; font-size: var(--step-3); letter-spacing: -.02em; }
.done p { margin: 0; color: var(--ink-2); max-width: 46ch; }

.fade { animation: fade .22s cubic-bezier(.4,0,.2,1); }
@keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade { animation: none; }
  #rail-fill { transition: none; }
}
</style>

    change: "change",

/* ── state ────────────────────────────────────────────────────────────── */
const LS = {
  who:   "kazscam.annotator",
  lang:  "kazscam.lang",
  theme: "kazscam.theme",
  buf:   "kazscam.buffer",
};

const state = {
  lang: "ru",
  db: null,
  downloads: null,
  items: [],
  labels: {},
  who: null,
  index: 0,
  verdict: null,
  playbook: null,
  shownAt: 0,
  filter: "",
  saveState: "offline",
  pending: {},
  flushTimer: null,
};

const $ = (id) => document.getElementById(id);
const t = (k) => I18N[state.lang][k];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch { return null; }
}

/* ── theme ────────────────────────────────────────────────────────────── */
function applyTheme(mode) {
  if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme(store(LS.theme) || "system");

$("btn-theme").addEventListener("click", () => {
  const order = ["system", "light", "dark"];
  const now = store(LS.theme) || "system";
  const next = order[(order.indexOf(now) + 1) % order.length];
  store(LS.theme, next);
  applyTheme(next);
});

/* ── language ─────────────────────────────────────────────────────────── */
state.lang = store(LS.lang) === "en" ? "en" : "ru";
$("btn-lang").addEventListener("click", () => {
  state.lang = state.lang === "ru" ? "en" : "ru";
  store(LS.lang, state.lang);
  renderChrome();
  renderGuide();
  renderStage();
  renderAdmin();
});

function renderChrome() {
  $("tagline").textContent = t("tagline");
  $("l-done").textContent = t("done");
  $("l-left").textContent = t("left");
  $("l-total").textContent = t("total");
  $("l-who").textContent = t("who");
  $("l-guide").textContent = t("guide");
  $("l-admin").textContent = t("admin");
  $("save-text").textContent = t(state.saveState === "offline" ? "offline"
    : state.saveState === "pending" ? "pending"
    : state.saveState === "failed" ? "failed" : "saved");

    : state.saveState === "pending" ? "pending"
    : state.saveState === "failed" ? "err" : "");

/* ── identity ─────────────────────────────────────────────────────────── */
function slug(name) {
  const base = name.trim().toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "").slice(0, 24);
  return base || "annotator";
}

function setWho(record) {
  state.who = record;
  store(LS.who, JSON.stringify(record));
  $("who-input").hidden = true;
  $("btn-who").hidden = true;
  $("l-who").hidden = true;
  const el = $("who-display");
  el.hidden = false;
  el.innerHTML = esc(record.name) + ' <span class="code">' + esc(record.id) + "</span> "
    + '<button class="ghost" id="btn-change">' + esc(t("change")) + "</button>";
  $("btn-change").addEventListener("click", () => {
    store(LS.who, "");
    location.reload();
  });
  loadMyLabels();
}

$("btn-who").addEventListener("click", commitName);
$("who-input").addEventListener("keydown", (e) => { if (e.key === "Enter") commitName(); });

function commitName() {
  const raw = $("who-input").value.trim();
  if (!raw) { $("who-input").focus(); return; }
  const suffix = Math.random().toString(36).slice(2, 6);
  setWho({ name: raw, id: slug(raw) + "-" + suffix });
  renderStage();
}

/* ── storage ──────────────────────────────────────────────────────────── */
async function connect() {
  let db = null;
  try { db = await claude.use("db"); } catch { db = null; }
  state.db = db;

  claude.use("downloads")
    .then((d) => { state.downloads = d; renderAdmin(); })
    .catch(() => {});
  if (!db) { state.saveState = "offline"; renderChrome(); renderStage(); renderAdmin(); return; }

  state.saveState = "saved";
  renderChrome();

  try {
    db.collection("corpus").onSnapshot((snap) => {
      const items = [];
      snap.docs.forEach((d) => {
        const body = d.data() || {};
        (body.items || []).forEach((it) => { if (it && it.id && it.text) items.push(it); });
      });
      items.sort((a, b) => String(a.id).localeCompare(String(b.id)));
      state.items = items;
      if (state.index >= items.length) state.index = 0;
      advanceToUnlabelled();
      renderStage();
      renderAdmin();
    }, () => { renderStage(); });
  } catch { /* design for absence */ }

  await loadMyLabels();
  flushBuffer();
}

async function loadMyLabels() {
  if (!state.db || !state.who) return;
  try {
    const snap = await state.db.doc("labels/" + state.who.id).get();
    state.labels = (snap.exists && (snap.data() || {}).labels) || {};
  } catch { state.labels = {}; }
  const local = JSON.parse(store(LS.buf) || "{}");
  Object.assign(state.labels, local[state.who.id] || {});
  advanceToUnlabelled();
  renderStage();
  renderAdmin();
}

function bufferLocally() {
  const all = JSON.parse(store(LS.buf) || "{}");
  all[state.who.id] = Object.assign(all[state.who.id] || {}, state.pending);
  store(LS.buf, JSON.stringify(all));
}

function queueSave(itemId, record) {
  state.pending[itemId] = record;
  bufferLocally();
  state.saveState = "pending";
  renderChrome();
  clearTimeout(state.flushTimer);
  state.flushTimer = setTimeout(flushBuffer, 900);
}

async function flushBuffer() {
  if (!state.db || !state.who) return;
  const batch = state.pending;
  if (!Object.keys(batch).length) return;
  state.pending = {};
  const ref = state.db.doc("labels/" + state.who.id);
  const payload = { labels: batch, name: state.who.name, updatedAt: new Date().toISOString() };
  try {
    await ref.update(payload);
  } catch {
    // update rejects when the document does not exist yet; create it whole.
    try {
      await ref.set({ name: state.who.name, updatedAt: payload.updatedAt,
                      labels: Object.assign({}, state.labels) });
    } catch {
      Object.assign(state.pending, batch);
      state.saveState = "failed";
      renderChrome();
      return;
    }
  }
  const all = JSON.parse(store(LS.buf) || "{}");
  delete all[state.who.id];
  store(LS.buf, JSON.stringify(all));
  state.saveState = "saved";
  renderChrome();
}

/* ── navigation ───────────────────────────────────────────────────────── */
function advanceToUnlabelled() {
  if (!state.items.length) return;
  let i = state.index;
  for (let n = 0; n < state.items.length; n++) {
    const item = state.items[(i + n) % state.items.length];
    if (!state.labels[item.id]) { state.index = (i + n) % state.items.length; return; }
  }
  state.index = state.items.length;
}

function current() { return state.items[state.index] || null; }

function submit(skipped) {
  const item = current();
  if (!item || !state.who) return;
  const record = {
    verdict: skipped ? "skip" : state.verdict,
    playbook: skipped ? null : (state.verdict === "scam" ? state.playbook : null),
    ms: Date.now() - state.shownAt,
    at: new Date().toISOString(),
  };
  state.labels[item.id] = record;
  queueSave(item.id, record);
  state.verdict = null;
  state.playbook = null;
  state.filter = "";
  state.index += 1;
  advanceToUnlabelled();
  renderStage();
}

function goBack() {
  for (let i = state.index - 1; i >= 0; i--) {
    if (state.labels[state.items[i].id]) {
      state.index = i;
      const prev = state.labels[state.items[i].id];
      state.verdict = prev.verdict === "skip" ? null : prev.verdict;
      state.playbook = prev.playbook || null;
      renderStage();
      return;
    }
  }
}

/* ── render: stage ────────────────────────────────────────────────────── */

    shown.forEach((p, i) => {

        + "<b>" + (i < 9 ? '<span class="num">' + (i + 1) + "</span>" : "") + esc(p[state.lang]) + "</b>"

    b.addEventListener("click", () => {
      state.verdict = b.dataset.v;
      state.playbook = null;
      if (state.verdict !== "scam") submit(false);
      else renderStage();
    });
  });
  stage.querySelectorAll(".pbtn").forEach((b) => {
    b.addEventListener("click", () => { state.playbook = b.dataset.pb; submit(false); });
  });
  const skipPb = $("pb-skip");
  if (skipPb) skipPb.addEventListener("click", () => { state.playbook = null; submit(false); });
  const filter = $("pb-filter");
  if (filter) {
    filter.addEventListener("input", () => {
      state.filter = filter.value;
      const pos = filter.selectionStart;
      renderStage();
      const again = $("pb-filter");
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    });
  }
  $("btn-skip").addEventListener("click", () => submit(true));
  $("btn-back").addEventListener("click", goBack);
}

/* ── keyboard ─────────────────────────────────────────────────────────── */
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  if (typing && e.target.id !== "pb-filter") return;
  if (!state.who || !state.db || !current()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (state.verdict === "scam") {
    if (e.key >= "1" && e.key <= "9") {
      const needle = state.filter.trim().toLowerCase();
      const shown = PLAYBOOKS.filter((p) => !needle
        || (p[state.lang] + " " + p["d" + state.lang] + " " + p.id).toLowerCase().includes(needle));
      const pick = shown[Number(e.key) - 1];
      if (pick) { e.preventDefault(); state.playbook = pick.id; submit(false); }
      return;
    }
    if (e.key === "0") { e.preventDefault(); state.playbook = null; submit(false); return; }
    if (e.key === "Escape") { e.preventDefault(); state.verdict = null; state.filter = ""; renderStage(); return; }
    if (typing) return;
  }

  if (typing) return;
  if (e.key === "1") { e.preventDefault(); state.verdict = "scam"; renderStage(); }
  else if (e.key === "2") { e.preventDefault(); state.verdict = "legit"; submit(false); }
  else if (e.key === "3") { e.preventDefault(); state.verdict = "unsure"; submit(false); }
  else if (e.key.toLowerCase() === "s") { e.preventDefault(); submit(true); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
  else if (e.key === "?") { e.preventDefault(); $("guide").open = !$("guide").open; }
});

/* ── render: admin ────────────────────────────────────────────────────── */
function kappa(a, b, keyOf) {
  const shared = Object.keys(a).filter((k) => b[k]);
  const cats = new Set();
  const pairs = [];
  shared.forEach((k) => {
    const x = keyOf(a[k]); const y = keyOf(b[k]);
    if (x == null || y == null) return;
    cats.add(x); cats.add(y);
    pairs.push([x, y]);
  });
  if (pairs.length < 2) return { n: pairs.length, k: null, agree: null };
  let agree = 0;
  const m1 = {}; const m2 = {};
  pairs.forEach(([x, y]) => {
    if (x === y) agree++;
    m1[x] = (m1[x] || 0) + 1;
    m2[y] = (m2[y] || 0) + 1;
  });
  const n = pairs.length;
  const po = agree / n;
  let pe = 0;
  cats.forEach((c) => { pe += ((m1[c] || 0) / n) * ((m2[c] || 0) / n); });
  const k = pe === 1 ? null : (po - pe) / (1 - pe);
  return { n, k, agree: po };
}

        + '</td><td class="num">' + med + "</td></tr>";
    });
    html += "</tbody></table></div></div>";
  }

  if (sets.length >= 2) {
    html += "<div><b>" + (ru ? "Согласие между разметчиками" : "Inter-annotator agreement") + "</b>"
      + '<p class="hint" style="margin:4px 0 8px">'
      + esc(ru ? "Каппа Коэна по вердикту и по сценарию, только на пересечении размеченных пар. Ниже 0.4 — категории спорные, ниже 0.2 — инструкцию нужно переписать."
               : "Cohen's kappa on the verdict and on the script, over overlapping pairs only. Below 0.4 the categories are contested; below 0.2 the guideline needs rewriting.")
      + "</p>"
      + '<div class="scroll-x"><table class="grid"><thead><tr><th>'
      + (ru ? "Пара" : "Pair") + "</th><th>n</th><th>"
      + (ru ? "Согласие" : "Agreement") + "</th><th>κ " + (ru ? "вердикт" : "verdict")
      + "</th><th>κ " + (ru ? "сценарий" : "script") + "</th></tr></thead><tbody>";
    for (let i = 0; i < sets.length; i++) {
      for (let j = i + 1; j < sets.length; j++) {
        const kv = kappa(sets[i].labels, sets[j].labels,
          (l) => (l.verdict === "skip" ? null : l.verdict));
        const kp = kappa(sets[i].labels, sets[j].labels,
          (l) => (l.verdict === "scam" && l.playbook ? l.playbook : null));
        html += "<tr><td>" + esc(sets[i].name) + " · " + esc(sets[j].name) + "</td>"
          + '<td class="num">' + kv.n + "</td>"
          + '<td class="num">' + (kv.agree == null ? "—" : (kv.agree * 100).toFixed(0) + "%") + "</td>"
          + '<td class="num">' + (kv.k == null ? "—" : kv.k.toFixed(2)) + "</td>"
          + '<td class="num">' + (kp.k == null ? "—" : kp.k.toFixed(2)) + "</td></tr>";
      }
    }
    html += "</tbody></table></div></div>";
  }

  body.innerHTML = html;

  const btnImport = $("btn-import");
  if (btnImport) btnImport.addEventListener("click", doImport);
  const btnExport = $("btn-export");
  if (btnExport) btnExport.addEventListener("click", () => doExport(sets, "json"));
  const btnCsv = $("btn-export-csv");
  if (btnCsv) btnCsv.addEventListener("click", () => doExport(sets, "csv"));
}

async function doImport() {
  const ru = state.lang === "ru";
  const msg = $("import-msg");
  if (!state.db) { msg.textContent = t("noDb"); return; }
  const raw = $("import-box").value;
  const source = ($("import-source").value || "press").trim();
  const chunks = raw.split(/^---$/m).map((s) => s.trim()).filter(Boolean);
  const texts = chunks.length > 1 ? chunks
    : raw.split("\n").map((s) => s.trim()).filter(Boolean);
  if (!texts.length) { msg.textContent = ru ? "Пусто" : "Nothing to import"; return; }

  const existing = new Set(state.items.map((i) => i.text));
  const fresh = texts.filter((x) => !existing.has(x));
  if (!fresh.length) { msg.textContent = ru ? "Все уже есть" : "All already present"; return; }

  const stamp = Date.now().toString(36);
  const items = fresh.map((text, i) => ({
    id: "ks-" + stamp + "-" + String(i).padStart(3, "0"),
    text, source, addedAt: new Date().toISOString(),
  }));

  msg.textContent = ru ? "Загружаю…" : "Importing…";
  try {
    for (let i = 0; i < items.length; i += 40) {
      const slice = items.slice(i, i + 40);
      await state.db.doc("corpus/batch-" + stamp + "-" + (i / 40)).set({
        items: slice, source, createdAt: new Date().toISOString(),
      });
    }
    $("import-box").value = "";
    msg.textContent = (ru ? "Добавлено: " : "Added ") + items.length;
  } catch (err) {
    msg.textContent = (ru ? "Ошибка: " : "Failed: ") + (err && err.code ? err.code : "unknown");
  }
}

async function doExport(sets, kind) {
  const ru = state.lang === "ru";
  const msg = $("export-msg");
  if (!state.downloads) { if (msg) msg.textContent = ru ? "Скачивание недоступно" : "Downloads unavailable"; return; }

  const rows = [];
  sets.forEach((s) => {
    Object.entries(s.labels).forEach(([itemId, l]) => {
      const item = state.items.find((i) => i.id === itemId);
      rows.push({
        item_id: itemId,
        text: item ? item.text : "",
        source: item ? item.source || "" : "",
        annotator: s.name,
        annotator_id: s.id,
        verdict: l.verdict,
        playbook: l.playbook || "",
        seconds: l.ms ? (l.ms / 1000).toFixed(1) : "",
        at: l.at || "",
      });
    });
  });
  if (!rows.length) { if (msg) msg.textContent = ru ? "Пока нечего выгружать" : "Nothing to export yet"; return; }

  let data;
  let filename;
  if (kind === "csv") {
    const cols = ["item_id", "annotator", "annotator_id", "verdict", "playbook", "seconds", "at", "source", "text"];
    const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    // Byte-order mark so Excel opens Cyrillic correctly.
    data = "﻿" + [cols.join(",")]
      .concat(rows.map((r) => cols.map((c) => q(r[c])).join(","))).join("\r\n");
    filename = "kazscam-labels.csv";
  } else {
    data = JSON.stringify({ exportedAt: new Date().toISOString(), rows }, null, 2);
    filename = "kazscam-labels.json";
  }

  if (msg) msg.textContent = ru ? "Готовлю файл…" : "Preparing…";
  try {
    await state.downloads.save({ filename, data });
    if (msg) msg.textContent = rows.length + (ru ? " строк выгружено" : " rows exported");
  } catch (err) {
    const code = err && err.code ? err.code : "unknown";
    if (msg) {
      msg.textContent = code === "declined"
        ? (ru ? "Отменено" : "Cancelled")
        : (ru ? "Не удалось: " : "Failed: ") + code;
    }
  }
}
