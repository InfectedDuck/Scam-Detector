services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saqbol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-saqbol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saqbol}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Migrations run before the server so a fresh box comes up with the schema.
    command: sh -c "alembic upgrade head && uvicorn saqbol.api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      # Inside compose the database is reachable as `db`, whatever .env says for a laptop.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saqbol}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-saqbol}
      SAQBOL_LLM_CACHE_DIR: /app/.cache/llm
      # The web service forwards each visitor's address so the daily limit is
      # per visitor, not per web server. Safe because this port is never
      # published beyond the loopback interface below.
      TRUST_PROXY: "1"
    volumes:
      - llmcache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bot:
    build: .
    command: python -m saqbol.bot.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saqbol}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-saqbol}
      SAQBOL_LLM_CACHE_DIR: /app/.cache/llm
      BOT_STATE_PATH: /app/state/bot.json
    volumes:
      - llmcache:/app/.cache
      - botstate:/app/state
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      SAQBOL_API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ru"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  llmcache:
  botstate:
