# Kazakh. The key set is identical to ru.yaml and a test enforces that, so an
# untranslated string is written as an explicit `null` with a `# TODO-kk`
# marker rather than being deleted. A null falls back to Russian at render time
# and the card says in its footer that it did, because a Russian sentence
# sitting silently inside a Kazakh card is worse than an obvious gap.
#
# Every `# TODO-kk` below is waiting on a native reviewer. Most of what remains
# is the link-and-domain family, where the terminology has to be chosen once and
# then used consistently across the bot, the site and the dataset card.

