action:
  generic:
    scam: "Әңгімені тоқтатыңыз. Ешкімге код, карта деректерін және құпиясөз айтпаңыз, ақша аудармаңыз, ешнәрсе орнатпаңыз. Банкке өзіңіз қоңырау шалыңыз — картаның артындағы нөмірге, олар берген нөмірге емес."
    suspicious: "Асықпаңыз және хабарламадағы сілтемені ашпаңыз. Ұйымға өзіңіз хабарласыңыз — оның ресми сайтындағы нөмір арқылы — және сізге жазған-жазбағанын сұраңыз."
