# Used only when no playbook applies. A playbook always brings its own action
# text, because advice is written by a person and reviewed, never assembled.
action:
  generic:
    scam: "Прекратите разговор. Никому не называйте код, данные карты и пароль, не переводите деньги и ничего не устанавливайте. Позвоните в банк сами — по номеру на обороте карты, а не по тому, который вам дали."
    suspicious: "Не торопитесь и не переходите по ссылке из сообщения. Свяжитесь с организацией сами, по номеру с её официального сайта, и спросите, писали ли вам."
    unsure: "Пока не разобрались — не давайте код, не переводите деньги и ничего не устанавливайте. Посоветуйтесь с близким человеком: пауза ничего не стоит, а спешка стоит денег."
    likely_safe: "Ничего делать не нужно. Общее правило остаётся: код из СМС, данные карты и пароль не сообщают никому, даже сотруднику банка."

