# Russian — the source language. Every key is written here first and must never
# be empty: the loader refuses a table with a hole in it, because a missing
# Russian string is a bug in the renderer rather than a pending translation.
#
# Placeholders in braces are part of the contract with the code. Renaming one
# here breaks the card; the wording around it is free.

band:
  scam:
    label: "Мошенничество"
    title: "Это похоже на мошенничество"
    summary: "В сообщении есть признаки известной мошеннической схемы. Не сообщайте коды, не переводите деньги и не устанавливайте приложения по этой просьбе."
  suspicious:
    label: "Подозрительно"
    title: "Подозрительное сообщение"
    summary: "Признаки настораживают, но их недостаточно для однозначного вывода. Проверьте отправителя по официальному номеру, прежде чем что-то делать."
  unsure:
    label: "Без вердикта"
    title: "Не берёмся судить"
    summary: "Сигналы противоречат друг другу, поэтому вердикта не будет. Отнеситесь к сообщению осторожно и проверьте его сами."
  likely_safe:
    label: "Признаков не найдено"
    title: "Признаков мошенничества не найдено"
    summary: "Явных признаков известных схем в сообщении нет. Это не гарантия: проверка смотрит на текст, а не на человека за ним."

abstained:
  line: "Почему без вердикта: {reason}."
  reason:
    disagreement: "правила и модель разошлись в оценке слишком сильно, чтобы усреднять их"
    low_self_consistency: "модель не повторила свой же ответ при перепроверке"
    unknown: "проверка остановилась до вывода"

stage:
  now: "Сейчас: {label} — {description}"
  next: "Дальше по сценарию: {label} — {description}"
  contact:
    label: "контакт"
    description: "с вами связались первый раз."
  hook:
    label: "зацепка"
    description: "рассказывают историю, которая заставляет вникнуть."
  trust:
    label: "доверие"
    description: "подтверждают свою легенду именем, документом или переводом на «специалиста»."
  pressure:
    label: "давление"
    description: "торопят, пугают и просят никому не рассказывать."
  extraction:
    label: "изъятие"
    description: "просят код, перевод или установку приложения."
  cashout:
    label: "вывод денег"
    description: "деньги уже уходят, и счёт идёт на минуты."

evidence:
  line: "«{quote}» — {label}"
  line_no_quote: "{label}"
  line_bare: "«{quote}»"
  none: "Отдельных признаков не нашлось."
  more: "…и ещё {count}"

