# Chinese. Terse, and aimed at the Chinese-speaking students the CN playbooks
# are written for. The key set is identical to ru.yaml and a test enforces that.
# Complete as a first draft and still unreviewed by a native speaker: mark any
# line that needs rework with `null  # TODO-zh` rather than guessing at it. The
# key stays, the value falls back to Russian, and the card says so in its
# footer.

band:
  scam:
    label: "诈骗"
    title: "这看起来是诈骗"
    summary: "消息中带有已知诈骗套路的特征。不要提供验证码，不要转账，也不要按对方要求安装任何应用。"
  suspicious:
    label: "可疑"
    title: "可疑消息"
    summary: "存在可疑迹象，但不足以下定论。做任何事之前，请通过官方号码核实发件人。"
  unsure:
    label: "无法判定"
    title: "无法给出结论"
    summary: "各项信号互相矛盾，因此不给出结论。请谨慎对待并自行核实。"
  likely_safe:
    label: "未发现迹象"
    title: "未发现诈骗迹象"
    summary: "没有已知套路的明显特征。这不是保证：本检测只看文字，看不到文字背后的人。"

abstained:
  line: "无法判定的原因：{reason}。"
  reason:
    disagreement: "规则与模型的判断相差过大，无法取中"
    low_self_consistency: "模型复核时没有重复自己的答案"
    unknown: "检测在得出结论前中止"

stage:
  now: "当前：{label} — {description}"
  next: "套路的下一步：{label} — {description}"
  contact:
    label: "接触"
    description: "对方第一次联系你。"
  hook:
    label: "下钩"
    description: "编一个让你上心的故事。"
  trust:
    label: "取信"
    description: "用你的姓名、证件或转接“专员”来坐实说法。"
  pressure:
    label: "施压"
    description: "催促、恐吓，并要求你别告诉任何人。"
  extraction:
    label: "索取"
    description: "索要验证码、转账或安装应用。"
  cashout:
    label: "提现"
    description: "钱已经在走，时间以分钟计。"

evidence:
  line: "「{quote}」— {label}"
  line_no_quote: "{label}"
  line_bare: "「{quote}」"
  none: "未发现单项迹象。"
  more: "…另有 {count} 项"

