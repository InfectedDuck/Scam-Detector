action:
  generic:
    scam: "立即结束对话。不要把验证码、卡片信息或密码告诉任何人，不要转账，不要安装任何东西。自己拨打银行电话——用卡背面印的号码，绝不要用对方给的号码。"
    suspicious: "不要着急，也不要点消息里的链接。自己联系该机构——用其官网上的电话——问清楚是否给你发过消息。"
    unsure: "在弄清楚之前，不要给验证码、不要转账、不要安装任何东西。和身边的人商量一下：停一停不花钱，着急才花钱。"
    likely_safe: "无需任何操作。基本规则不变：短信验证码、卡片信息和密码不告诉任何人，包括自称银行员工的人。"

