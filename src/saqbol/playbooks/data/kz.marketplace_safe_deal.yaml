# OLX / Instagram "safe deal" link. The counterparty moves the conversation to
# a messenger and sends a payment page that debits rather than credits.
id: kz.marketplace_safe_deal
version: 1
region: KZ
family: marketplace_fraud

name:
  ru: "«Безопасная сделка» на OLX или в Instagram"

summary:
  ru: "Покупатель или продавец уводит переписку в мессенджер и присылает ссылку «для безопасной сделки», на которой с карты не зачисляют, а списывают деньги."

retrieval_phrases:
  - "покупатель просит перейти в whatsapp с олх"
  - "написал, что уже оплатил, и прислал ссылку на получение денег"
  - "просят оформить доставку через ссылку"
  - "прислали ссылку на безопасную сделку"
  - "на странице просят номер карты, срок действия и cvv"
  - "покупатель не хочет встречаться и предлагает предоплату"
  - "продавец попросил предоплату и потом пропал"
  - "написали в директ инстаграма по объявлению"
  - "просят данные карты, чтобы перевести мне деньги"
  - "ссылка выглядит как сайт олх, но адрес другой"
  - "покупатель торопит и говорит, что уезжает"
  - "предлагают сделку через курьера и ссылку на оплату"
  - "после ввода данных с карты списали деньги"
  - "просят подтвердить получение денег кодом из смс"
  # Kazakh, in the register a victim or a scammer actually uses; the
  # Russian banking nouns stay Russian, as they do in real messages.
  - "olx-те сатып алушы жеткізу арқылы төледім деді"
  - "ақшаны алу үшін сілтемеге өтіңіз деді"
  - "картаңыздың нөмірін және cvv кодты енгізіңіз деді"
  - "сатып алушы whatsapp-қа жазыңыз деді"
  - "қауіпсіз мәміле деп сілтеме жіберді"
  - "төлемді сілтеме арқылы алыңыз деген хабарлама"
  - "хабарландыру әлі өзекті ме деп жазды да сілтеме жіберді"
  - "тауарды көрмей жатып төледім деді"
  - "олх жеткізу қызметі атынан сайтқа кіргізді"

expected_indicators:
  - D2.leave_platform
  - D1.move_to_messenger
  - G1.lookalike_domain
  - G5.brand_mismatch
  - A2.card_secrets

stages:
  contact:    { ru: "Отклик на объявление, после которого переписку сразу уводят в WhatsApp или Telegram." }
  hook:       { ru: "«Я уже оплатил, получите деньги по этой ссылке» или «оформим доставку через сервис»." }
  trust:      { ru: "Ссылка ведёт на копию сайта площадки с логотипом и вашим же объявлением." }
  pressure:   { ru: "Собеседник торопит: уезжает, курьер уже выехал, ссылка действует недолго." }
  extraction: { ru: "На поддельной странице просят номер карты, срок действия, CVV и код из СМС." }
  cashout:    { ru: "Вместо зачисления с карты списывают деньги, иногда несколькими платежами подряд." }

red_flags:
  ru:
    - "Чтобы получить деньги, номер карты и CVV не нужны никогда: эти данные нужны только для списания."
    - "Ни OLX, ни Kolesa не принимают оплату по ссылке из переписки — настоящая сделка идёт внутри площадки."
    - "Уход из чата площадки в мессенджер лишает вас и переписки, и поддержки, если что-то пойдёт не так."

action:
  key: action.stay_on_platform
  ru: "Не открывайте ссылку и вернитесь в чат площадки. Деньги за товар принимайте только внутри сервиса или наличными при встрече. Если данные карты уже введены, заблокируйте карту и обратитесь в полицию."

hotline: "102"
hotlines:
  - { name: "Полиция", number: "102" }
  - { name: "Kaspi Bank", number: "9999" }
  - { name: "Halyk Bank", number: "7111" }
  - { name: "АРРФР (права потребителей финуслуг)", number: "1459" }

sources:
  # Полиция (МВД РК, polisia.kz): виды мошенничества, включая объявления и CVV
  - https://polisia.kz/ru/v-mvd-rasskazali-o-vidah-moshennichestva/
  # Правила безопасности самой площадки OLX Казахстан
  - https://www.olx.kz/safetyuser/
  # Пресса: разбор фишинговых ссылок «доставки» на OLX
  - https://lsm.kz/moshennikI-phishing-internet
