id: kz.apk_install
version: 1
region: KZ
family: malware_install

name:
  ru: "Установка apk-файла из переписки"

summary:
  ru: "В переписке присылают файл-приложение: «обновление банка», «документ из суда», «трекер посылки». После установки телефон и банковское приложение управляются чужим человеком."

# Phrases used ONLY for embedding/retrieval. Not shown to users.
# Written the way a victim describes what happened, not the way the message reads.
retrieval_phrases:
  - "прислали файл apk в вотсапе"
  - "просят установить приложение по ссылке из сообщения"
  - "сказали обновить приложение банка через присланную ссылку"
  - "прислали документ из суда который надо открыть приложением"
  - "приложение для отслеживания посылки прислали в чате"
  - "просят разрешить установку из неизвестных источников"
  - "скачал приложение и телефон начал греться и тормозить"
  - "после установки списали деньги с карты"
  - "ссылка была похожа на гугл плей но это был не он"
  - "звонили из казахтелекома и прислали ссылку на приложение"
  - "приложение попросило доступ к смс и уведомлениям"
  - "прислали штраф со ссылкой для оплаты"
  - "просят установить программу чтобы проверить телефон"
  - "установил файл и теперь не могу зайти в банк"
  # Kazakh, in the register a victim or a scammer actually uses; the
  # Russian banking nouns stay Russian, as they do in real messages.
  - "сілтеме арқылы apk файл орнатыңыз деді"
  - "банк қосымшасын жаңартыңыз деген сілтеме келді"
  - "сәлемдемені бақылау үшін қосымшаны орнатыңыз деді"
  - "play protect-ті өшіріңіз деді"
  - "қосымшаны play market-тен емес, сілтемеден жүктеңіз деді"
  - "whatsapp-қа apk файл жіберді"
  - "қосымшаны орнатпасаңыз қолжетімділік жабылады деді"
  - "мекенжайды қосымшада растаңыз деген смс"
  - "орнатқаннан кейін картадан ақша шығып кетті"

expected_indicators:
  - F2.apk_attachment
  - F3.install_instruction
  - F4.disable_protection
  - C1.bank_security
  - C2.police_prosecutor
  - C6.courier_post

stages:
  contact:
    ru: "Звонок или сообщение от «банка», «суда», «Казахтелекома» или курьерской службы."
  hook:
    ru: "Нужно срочно обновить приложение, открыть документ или отследить посылку."
  trust:
    ru: "Ссылка ведёт на страницу, оформленную под Google Play или под сайт знакомой организации."
  pressure:
    ru: "Торопят установить прямо сейчас и просят разрешить установку из неизвестных источников."
  extraction:
    ru: "Приложение запрашивает доступ к СМС, уведомлениям и экрану — и передаёт банковские коды."
  cashout:
    ru: "Со счетов списывают деньги или оформляют заём, пока телефон у вас в руках."

red_flags:
  ru:
    - "Банковские приложения не рассылают в мессенджерах. Они бывают только в Google Play, App Store и AppGallery, и разработчиком там указан сам банк."
    - "Файл с расширением .apk — это не документ и не посылка. Это программа, и после установки она видит ваш экран и ваши СМС."
    - "Просьба разрешить «установку из неизвестных источников» означает одно: отключите защиту телефона."
    - "Официальные уведомления о штрафах и взысканиях приходят с номера 1414 и никогда не содержат ссылок для оплаты."

action:
  key: action.do_not_install_apk
  ru: "Не устанавливайте файл и удалите его из переписки. Если приложение уже установлено — отключите Wi-Fi и мобильный интернет, удалите его, с другого телефона позвоните в банк и заблокируйте карты, затем подайте заявление в полицию по 102."

hotline: "102"
hotlines:
  - { name: "Полиция", number: "102" }
  - { name: "Kaspi Bank", number: "9999" }
  - { name: "Единый контакт-центр eGov", number: "1414" }

sources:
  - https://guide.kaspi.kz/client/ru/app/security/q2099
  - https://polisia.kz/ru/moshenniki-rassylayut-fal-shivye-postanovleniya-o-narushenii-pdd/
  - https://www.inform.kz/ru/politsiya-preduprezhdaet-o-novoy-sheme-moshennichestva-pod-vidom-kazahtelekoma-630ddf
