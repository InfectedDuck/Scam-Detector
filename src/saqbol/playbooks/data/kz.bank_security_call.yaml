# Fake bank security service call. Highest-volume script in Kazakhstan.
# Kazakh, English and Chinese are translated in week 2 by the co-annotators.
id: kz.bank_security_call
version: 1
region: KZ
family: authority_impersonation

name:
  ru: "Звонок «службы безопасности банка»"

summary:
  ru: "Звонят якобы из банка, говорят, что с вашего счёта прямо сейчас снимают деньги, и выводят на код из СМС или перевод на «безопасный счёт»."

# Embedding only, never shown. Written the way a victim describes the call,
# not the way the caller scripts it.
retrieval_phrases:
  - "мне позвонили из службы безопасности банка"
  - "звонок с незнакомого номера, представились сотрудником банка"
  - "сказали, что с моего счёта пытаются списать деньги"
  - "просят назвать код из смс, который только что пришёл"
  - "предлагают перевести деньги на безопасный счёт"
  - "переключили на следователя банка"
  - "звонили в whatsapp, на аватарке логотип банка"
  - "назвали моё фио и последние цифры карты"
  - "говорят не класть трубку и никому не рассказывать"
  - "прислали фото удостоверения сотрудника"
  - "сказали, что на меня пытаются оформить кредит"
  - "торопят, говорят что деньги уйдут через несколько минут"
  - "просят продиктовать данные карты и cvv"
  - "сказали, что это тайна следствия"
  - "просили не отвечать, если перезвонит банк"

expected_indicators:
  - C1.bank_security
  - A1.otp_request
  - E1.safe_account
  - B1.urgency
  - B4.money_at_risk
  - D3.dont_hang_up
  - J1.secrecy

stages:
  contact:    { ru: "Неожиданный звонок или звонок в WhatsApp с незнакомого номера." }
  hook:       { ru: "Говорят, что с вашего счёта прямо сейчас пытаются списать деньги." }
  trust:      { ru: "Называют ваше ФИО, переключают на «следователя», присылают фото удостоверения." }
  pressure:   { ru: "Требуют не класть трубку, называют разговор тайной следствия и просят никому не говорить." }
  extraction: { ru: "Просят код из СМС, полные данные карты или перевод на «безопасный счёт»." }
  cashout:    { ru: "Деньги уходят на чужие счета, либо на ваше имя оформляют кредит." }

red_flags:
  ru:
    - "Настоящий банк никогда не спрашивает код из СМС, ПИН или CVV: эти данные нужны только тому, кто хочет забрать ваши деньги."
    - "«Безопасного счёта» не существует ни в одном банке Казахстана. Перевод туда — это перевод мошеннику."
    - "Просьба не класть трубку и никому не рассказывать нужна лишь затем, чтобы вы не успели проверить звонок."

action:
  key: action.hang_up_call_bank
  ru: "Положите трубку. Перезвоните в банк сами — по номеру на обороте карты или через приложение, а не по тому номеру, который вам назвали. Если вы уже назвали код или данные карты, заблокируйте карту и подайте заявление в полицию."

hotline: "1414"
hotlines:
  - { name: "Kaspi Bank", number: "9999" }
  - { name: "Halyk Bank", number: "7111" }
  - { name: "Bank CenterCredit", number: "505" }
  - { name: "eGov", number: "1414" }
  - { name: "Полиция", number: "102" }

sources:
  # Полиция (МВД РК, polisia.kz): звонок «службы безопасности банка» и RustDesk
  - https://polisia.kz/ru/novoe-prilozhenie-ispol-zuyut-moshenniki-dlya-krazhi-deneg-so-schetov-kazahstantsev/
  # Банк ЦентрКредит: разбор схемы «безопасный счёт»
  - https://www.bcc.kz/about/press-center/safe-account/
  # Пресса
  - https://www.zakon.kz/obshestvo/6518264-kak-moshenniki-zastavlyayut-kazakhstantsev-otdavat-milliony.html
