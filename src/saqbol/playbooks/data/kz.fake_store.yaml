id: kz.fake_store
version: 1
region: KZ
family: fake_merchant

name:
  ru: "Фейковый магазин с предоплатой"

summary:
  ru: "Магазин в Instagram или сайт с ценой заметно ниже рынка берёт предоплату на карту физлица — и после перевода перестаёт отвечать."

# Phrases used ONLY for embedding/retrieval. Not shown to users.
# Written the way a victim describes what happened, not the way the listing reads.
retrieval_phrases:
  - "заказала в инстаграм магазине и товар не пришёл"
  - "перевела предоплату продавцу и он пропал"
  - "просят предоплату на карту частного лица"
  - "цена была намного ниже чем везде"
  - "сказали остался последний размер надо брать сейчас"
  - "магазин закрыл страницу после оплаты"
  - "продавец заблокировал меня после перевода"
  - "просили внести бронь чтобы придержать товар"
  - "сайт открыли пару недель назад"
  - "нет реквизитов компании только номер каспи"
  - "обещали доставку по всему казахстану а трек не дают"
  - "оплатил и телефон продавца больше не отвечает"
  - "интернет магазин собрал деньги и не привёз технику"
  - "отзывы под постами оказались накрученными"
  # Kazakh, in the register a victim or a scammer actually uses; the
  # Russian banking nouns stay Russian, as they do in real messages.
  - "instagram-дағы дүкен алдын ала төлем сұрады"
  - "тауар бар, соңғы данасы қалды деді"
  - "толық алдын ала төлем арқылы жұмыс істейміз деді"
  - "kaspi нөміріне аударыңыз, чекті жіберіңіз деді"
  - "бронь тек бүгін деп асықтырды"
  - "бағасы дүкендегіден әлдеқайда төмен"
  - "төлегеннен кейін жауап бермей қойды, бұғаттады"
  - "жеткізу төлемін алдын ала аударыңыз деді"
  - "аккаунт жаңа, пікірлер жоқ, тек жақсы отзыв"

expected_indicators:
  - G6.fresh_domain
  - G1.lookalike_domain
  - E7.upfront_fee
  - H3.unsolicited_prize

stages:
  contact:
    ru: "Объявление, реклама в ленте или страница магазина в Instagram."
  hook:
    ru: "Товар есть в наличии и заметно дешевле, чем везде, но остался последний."
  trust:
    ru: "Аккуратная витрина, комментарии довольных покупателей и обещание доставки по всему Казахстану."
  pressure:
    ru: "Просят внести предоплату или бронь сегодня, иначе товар уйдёт другому."
  extraction:
    ru: "Перевод идёт на карту или номер физического лица, а не оплатой в магазине."
  cashout:
    ru: "Продавец перестаёт отвечать, страницу удаляют или вас блокируют."

red_flags:
  ru:
    - "Перевод на карту физического лица — это не оплата магазину. У настоящего продавца есть БИН, название ТОО или ИП и адрес, и он их показывает без уговоров."
    - "Цена сильно ниже рынка плюс «остался последний» — это приманка и таймер, а не удача."
    - "Домен, зарегистрированный пару недель назад, у работающего магазина не бывает: возраст сайта видно через whois."
    - "Комментарии под постами накручиваются, а неудобные удаляются. Ищите название магазина вместе со словом «обман» вне его собственной страницы."

action:
  key: action.pay_on_delivery_and_check_seller
  ru: "Не платите предоплату. Договоритесь об оплате при получении или покупайте внутри площадки, где есть защита сделки. Проверьте БИН и юридическое лицо продавца, а его имя поищите отдельно вместе со словом «обман». Если деньги уже переведены — сохраните переписку и чек и обратитесь в полицию по 102."

hotline: "102"
hotlines:
  - { name: "Полиция", number: "102" }
  - { name: "Kaspi Bank", number: "9999" }

sources:
  - https://polisia.kz/ru/fejkovyj-butik-v-instagram-politsiya-presekla-shemu-internet-moshennichestva-v-almaty/
  - https://www.gov.kz/memleket/entities/qriim/press/news/details/389462?lang=ru
  - https://tengrinews.kz/kazakhstan_news/obman-6-milliardov-kazahstantsyi-stali-jertvami-moshennikov-605414/
