# Money-mule recruitment ("дропперство"). The one playbook where the user may
# be a willing participant, so the advice is written as consequence
# information rather than as an accusation.
id: kz.mule_account_rental
version: 1
region: KZ
family: money_laundering_recruitment

name:
  ru: "Аренда карты или счёта (дропперство)"

summary:
  ru: "Предлагают заработок за то, что через вашу карту или счёт пройдут чужие переводы. С сентября 2025 года это уголовная статья, и отвечает владелец карты."

retrieval_phrases:
  - "предложили сдать карту в аренду за деньги"
  - "просят принять перевод и отправить дальше, оставив процент"
  - "написали в телеграм с предложением лёгкого заработка"
  - "нужна ваша карта для переводов компании"
  - "обещают платить за каждую транзакцию"
  - "просят оформить карту на своё имя и отдать её"
  - "предлагают работу без опыта, нужна только карта"
  - "просят снять наличные и передать курьеру"
  - "предложили подработку студентам через банковскую карту"
  - "просят логин и пароль от мобильного банка за вознаграждение"
  - "говорят, что это законно и просто обход комиссии"
  - "предлагают деньги за оформление сим-карты и счёта"
  - "после чужого перевода мою карту заблокировали"
  - "просят открыть счёт на себя для чужого бизнеса"

expected_indicators:
  - E5.mule_recruitment
  - H4.easy_job
  - D1.move_to_messenger

stages:
  contact:    { ru: "Предложение подработки в Telegram, соцсети или в чате." }
  hook:       { ru: "Обещают оплату за то, что через вашу карту пройдут чужие переводы." }
  trust:      { ru: "Схему называют законной, показывают отзывы и делают первые небольшие выплаты." }
  extraction: { ru: "Просят карту, доступ к мобильному банку либо снятие наличных и передачу курьеру." }
  cashout:    { ru: "Через ваш счёт проходят похищенные деньги, счёт блокируют, а вопросы задают вам." }

red_flags:
  ru:
    - "С 16 сентября 2025 года передача карты, счёта или доступа к мобильному банку — уголовная статья 232-1 УК РК: от штрафа до 7 лет с конфискацией."
    - "Отвечает владелец счёта: в деле фигурирует ваша карта, а не человек, который вам написал."
    - "Счёт блокируют, дистанционное обслуживание отключают, а пострадавшие взыскивают ущерб через суд — с вас."

action:
  key: action.refuse_card_rental
  ru: "Откажитесь и прекратите переписку: карта, счёт и доступ к мобильному банку остаются только вашими. Если чужой перевод уже прошёл, сами обратитесь в банк и в полицию — явка с повинной и сотрудничество со следствием учитываются."

hotline: "102"
hotlines:
  - { name: "Полиция", number: "102" }
  - { name: "АРРФР (права потребителей финуслуг)", number: "1459" }
  - { name: "eGov", number: "1414" }

sources:
  # АРРФР, портал финансовой грамотности: «Дропперство = преступление»
  - https://fingramota.kz/ru/news/post/dropperstvo-prestuplenie
  # Пресса: введение статьи 232-1 УК РК
  - https://kapital.kz/gosudarstvo/140639/v-kazahstane-vvedena-ugolovnaya-otvetstvennost-za-dropperstvo.html
  # Пресса: размеры наказания по составам статьи
  - https://profit.kz/news/71245/Ugolovnoe-nakazanie-dlya-dropperov-vveli-v-Kazahstane/
