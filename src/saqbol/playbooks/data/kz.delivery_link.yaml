# Fake parcel, post or customs payment link.
id: kz.delivery_link
version: 1
region: KZ
family: phishing_link

name:
  ru: "Фишинговая ссылка о посылке или доставке"
  kk: "Сәлемдеме немесе жеткізу туралы фишингтік сілтеме"
  en: "Phishing link about a parcel or delivery"

summary:
  ru: "Сообщение о задержанной посылке с просьбой доплатить за доставку или таможню по ссылке, которая ведёт на поддельную страницу оплаты."
  kk: "Сәлемдемеңіз ұсталды, жеткізу немесе кеден төлемін сілтеме арқылы төлеңіз деген хабарлама келеді. Сілтеме жалған төлем бетіне апарады."
  en: "A message says your parcel is held and asks you to pay a delivery or customs fee through a link that leads to a fake payment page."

retrieval_phrases:
  - "пришло смс, что посылка ждёт оплаты доставки"
  - "написали, что курьер не смог доставить посылку"
  - "просят уточнить адрес по ссылке, иначе посылку вернут"
  - "сообщение от казпочты со ссылкой на оплату"
  - "требуют оплатить таможенный сбор за посылку"
  - "сумма маленькая, всего несколько сотен тенге"
  - "ссылка похожа на сайт почты, но адрес чуть другой"
  - "я ничего не заказывал, а мне пишут про посылку"
  - "ссылка сокращённая, не видно куда она ведёт"
  - "на странице просят номер карты и cvv"
  - "пишут в whatsapp от имени службы доставки"
  - "говорят, что посылку хранят только сутки"
  - "после оплаты с карты списали намного больше"
  - "прислали трек-номер и ссылку для оплаты"
  # Kazakh, in the register a victim or a scammer actually uses; the
  # Russian banking nouns stay Russian, as they do in real messages.
  - "сәлемдемеңіз кеденде ұсталды деген смс келді"
  - "қазпошта атынан сілтеме келді"
  - "жеткізу төлемін сілтеме арқылы төлеңіз деді"
  - "кеден төлемін 24 сағат ішінде төлеңіз деп жазды"
  - "төлемесеңіз сәлемдеме кері жіберіледі деп қорқытты"
  - "мекенжайды растау үшін сілтемеге өтіңіз деді"
  - "посылка келді, картаңызбен төлеңіз деген хабарлама"
  - "жеткізу қызметінен сілтемемен смс келді"
  - "сілтемеде карта деректерін енгізу керек"

expected_indicators:
  - C6.courier_post
  - G1.lookalike_domain
  - G3.shortener
  - G5.brand_mismatch
  - B1.urgency
  - E7.upfront_fee

stages:
  contact:
    ru: "СМС или сообщение в мессенджере якобы от почты, курьера или таможни."
    kk: "Пошта, курьер немесе кеден атынан СМС не мессенджерде хабарлама келеді."
    en: "An SMS or messenger message supposedly from the post office, a courier or customs."
  hook:
    ru: "Посылка не доставлена или задержана: нужно уточнить адрес либо доплатить."
    kk: "Сәлемдеме жеткізілмеді немесе ұсталды: мекенжайды растау немесе қосымша төлеу керек дейді."
    en: "The parcel was not delivered or is being held: you need to confirm the address or pay an extra fee."
  pressure:
    ru: "Срок хранения истекает, иначе посылку вернут отправителю."
    kk: "Сақтау мерзімі бітіп жатыр, әйтпесе сәлемдеме жіберушіге қайтарылады дейді."
    en: "The storage period is running out; otherwise the parcel goes back to the sender."
  extraction:
    ru: "По ссылке открывается копия сайта, где просят данные карты ради «небольшой» оплаты."
    kk: "Сілтеме сайттың көшірмесін ашады, онда «шағын» төлем үшін карта деректерін сұрайды."
    en: "The link opens a copy of the real site, which asks for card details for a \"small\" payment."
  cashout:
    ru: "С карты списывают всю доступную сумму, а данные используют для новых списаний."
    kk: "Картадан барлық қолжетімді соманы шығарады, ал деректерді жаңа төлемдерге пайдаланады."
    en: "The whole available balance is taken from the card, and the details are reused for further charges."

red_flags:
  ru:
    - "Настоящее уведомление о посылке никогда не требует вводить номер карты и CVV на странице из ссылки."
    - "Казпочта присылает уведомления только с короткого номера 1499, а статус посылки виден в приложении post.kz."
    - "Адрес поддельного сайта отличается от настоящего одной-двумя буквами или лишним словом в домене."
  kk:
    - "Сәлемдеме туралы нағыз хабарлама сілтемедегі бетке карта нөмірі мен CVV енгізуді ешқашан талап етпейді."
    - "Қазпошта хабарламаны тек 1499 қысқа нөмірінен жібереді, ал сәлемдеменің статусы post.kz қосымшасында көрінеді."
    - "Жалған сайттың мекенжайы нағызынан бір-екі әріппен немесе доменге қосылған артық сөзбен ғана ерекшеленеді."
  en:
    - "A genuine parcel notification never asks you to enter a card number and CVV on a page behind a link."
    - "Kazpost (the national postal service) sends notifications only from the short number 1499, and parcel status is visible in the post.kz app."
    - "A fake site's address differs from the real one by one or two letters or an extra word in the domain."

action:
  key: action.check_tracking_on_official_site
  ru: "Не открывайте ссылку. Проверьте трек-номер на сайте или в приложении перевозчика, набрав адрес вручную. Если данные карты уже введены, немедленно заблокируйте карту и обратитесь в полицию."
  kk: "Сілтемені ашпаңыз. Трек-нөмірді тасымалдаушының сайтында немесе қосымшасында тексеріңіз — мекенжайды өзіңіз қолмен теріп. Карта деректерін енгізіп қойған болсаңыз, картаны дереу бұғаттап, полицияға хабарласыңыз."
  en: "Do not open the link. Check the tracking number on the carrier's own site or app, typing the address yourself. If you already entered card details, block the card at once and contact the police."

hotline: "102"
hotlines:
  - { name: "Казпочта", number: "1499" }
  - { name: "Полиция", number: "102" }
  - { name: "eGov", number: "1414" }

sources:
  # Полиция (МВД РК, polisia.kz): мошенники представляются сотрудниками почты
  - https://polisia.kz/ru/moshenniki-predstavlyayutsya-sotrudnikami-pochtovoj-sluzhby/
  # Пресса: обращение «Казпочты», официальный номер отправителя 1499
  - https://tengrinews.kz/healthy/vam-prishla-posyilka-kazpochta-obratilas-k-kazahstantsam-543707/
  # Пресса: оплата несуществующих посылок по фишинговой ссылке
  - https://informburo.kz/novosti/mosenniki-ot-imeni-kazpocty-predlagayut-kazaxstancam-oplatit-nesushhestvuyushhie-posylki
