name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,bot,eval,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      # Core must pass with no network and no API keys.
      - name: Test
        run: pytest -m "not network and not llm" --cov=saqbol --cov-report=term-missing

      # Thirty-ish fixture rows through the whole harness, offline. Proves the
      # evaluation pipeline still runs on every commit, at no cost.
      - name: Smoke eval
        run: |
          python -m saqbol.eval run --config eval/configs/smoke.yaml --out /tmp/evalrun --run-id ci
          python -m saqbol.eval leaderboard --results /tmp/evalrun/ci/results.json --out /tmp/evalrun/ci/leaderboard.md
          test -s /tmp/evalrun/ci/leaderboard.md

  # The web app builds against the same playbook and i18n files the backend
  # ships, with no API configured, so the prerendered pages are proven on
  # every commit without a server.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Form and screenshot regressions
        run: npm run test

      - name: Build
        run: npm run build

      - name: Sample pages with an unavailable analysis service
        run: npm run test:smoke
